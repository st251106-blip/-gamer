<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DURIAN FIGHTER 〜魔法の果実〜</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* --- ベーススタイル --- */
        :root {
            --disney-gold: #FFD700;
            --disney-blue: #0f172a;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Noto Serif JP', serif;
            background-color: var(--disney-blue);
            color: white;
            overflow: hidden;
            user-select: none;
            touch-action: manipulation; /* スマホでのズーム防止 */
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .font-magic {
            font-family: 'Cinzel', serif;
        }
        .hidden {
            display: none !important;
        }
        
        /* --- 背景・エフェクト --- */
        .bg-gradient {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(ellipse at center, rgba(30,58,138,0.4) 0%, rgba(15,23,42,0.8) 50%, #000 100%);
            z-index: 0;
            pointer-events: none;
        }
        .stars {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle infinite ease-in-out;
            box-shadow: 0 0 5px #fff, 0 0 10px #FFD700;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        #special-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 30;
            background: radial-gradient(circle, rgba(147,51,234,0.5) 0%, rgba(0,0,0,0.8) 100%);
            mix-blend-mode: hard-light;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        #special-overlay.show {
            opacity: 1;
        }

        /* --- 画面レイアウト --- */
        .screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s;
        }
        .screen-dark {
            background-color: rgba(0, 0, 0, 0.8);
        }

        /* --- タイトル画面 --- */
        .title-sub {
            color: #facc15;
            font-size: 1.25rem;
            letter-spacing: 0.3em;
            margin-bottom: 0.5rem;
            text-align: center;
        }
        .title-main {
            font-size: 4rem;
            font-weight: bold;
            background: linear-gradient(to bottom, #fef08a, #ca8a04);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(255,215,0,0.5));
            margin-bottom: 3rem;
            text-align: center;
        }
        @media (min-width: 768px) { .title-main { font-size: 6rem; } }

        /* --- 汎用ボタン・パネル --- */
        .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            border-radius: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .glass-panel:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .btn-magic {
            background: linear-gradient(135deg, rgba(255,215,0,0.2) 0%, rgba(255,215,0,0) 100%);
            border: 2px solid var(--disney-gold);
            box-shadow: 0 0 10px rgba(255,215,0,0.3);
            border-radius: 9999px;
            color: #fef9c3;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.1s ease;
        }
        .btn-magic:active {
            transform: scale(0.95);
            background: rgba(255,215,0,0.3);
        }
        .btn-large {
            padding: 1.25rem 3rem;
            font-size: 1.5rem;
            letter-spacing: 0.1em;
        }

        /* --- キャラ選択画面 --- */
        .select-title {
            font-size: 2.25rem;
            color: #fde047;
            margin-bottom: 2rem;
            text-align: center;
        }
        .select-grid {
            display: flex;
            gap: 1.5rem;
            width: 100%;
            max-width: 56rem;
            justify-content: center;
        }
        .char-card {
            flex: 1;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-top: 2px solid rgba(255,215,0,0.5);
        }
        .char-card.blue { border-top-color: rgba(96,165,250,0.5); }
        .char-card.red { border-top-color: rgba(248,113,113,0.5); }
        .char-icon { font-size: 4rem; margin-bottom: 1rem; }
        .char-name { font-size: 1.125rem; font-weight: bold; color: #fef08a; }
        .char-name.blue { color: #bfdbfe; }
        .char-name.red { color: #fecaca; }
        .char-desc { font-size: 0.75rem; color: #9ca3af; margin-top: 0.5rem; text-align: center; }

        /* --- バトル画面 UI --- */
        #screen-battle {
            z-index: 10;
            justify-content: space-between;
        }
        
        /* HUD */
        .hud {
            width: 100%;
            padding: 1.5rem 1rem 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
            z-index: 20;
        }
        .hud-side { width: 45%; }
        .hud-center {
            width: 10%;
            display: flex;
            justify-content: center;
            font-size: 2.25rem;
            color: var(--disney-gold);
            filter: drop-shadow(0 0 5px var(--disney-gold));
        }
        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 0.25rem;
        }
        .hud-header.reverse { flex-direction: row-reverse; }
        .hud-name {
            font-size: 1.25rem;
            font-weight: bold;
            color: #fef08a;
        }
        .hud-name.enemy { color: #d8b4fe; }
        
        .hp-border {
            width: 100%;
            height: 2rem;
            background-color: #450a0a;
            border: 2px solid #9ca3af;
            border-radius: 0.25rem;
            padding: 2px;
            display: flex;
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        .hp-border.player { justify-content: flex-end; }
        .hp-border.enemy { justify-content: flex-start; }
        
        .hp-bar {
            height: 100%;
            width: 100%;
            transition: width 0.2s ease-out;
        }
        .hp-bar.player { background: linear-gradient(to left, #fde047, #eab308); }
        .hp-bar.enemy { background: linear-gradient(to right, #ef4444, #b91c1c); }

        /* 闘技場 */
        .arena {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 3rem 2rem;
            z-index: 10;
        }
        @media (min-width: 768px) { .arena { padding: 0 8rem 2rem; } }
        
        .sprite-wrapper { position: relative; z-index: 20; }
        .sprite-wrapper.enemy { z-index: 10; }
        
        .sprite {
            font-size: 8rem;
            filter: drop-shadow(0 25px 25px rgba(0,0,0,0.5));
            transform-origin: bottom;
        }
        @media (min-width: 768px) { .sprite { font-size: 12rem; } }
        .scale-x-reverse { transform: scaleX(-1); }

        .shield-effect {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            transform: scale(1.5);
            filter: blur(10px);
            opacity: 0;
            transition: opacity 0.2s;
        }
        .shield-player { background-color: rgba(59, 130, 246, 0.4); }
        .shield-enemy { background-color: rgba(168, 85, 247, 0.4); }

        /* コントロールパネル */
        .controls-container {
            padding: 1rem;
            background: linear-gradient(to top, rgba(0,0,0,1), rgba(0,0,0,0.8), transparent);
            z-index: 20;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        @media (min-width: 768px) { .controls-container { padding: 2rem; } }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
            max-width: 48rem;
            margin: 0 auto;
            width: 100%;
        }
        .btn-control {
            flex: 1;
            padding: 1rem 0;
            border-radius: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.25rem;
            position: relative;
            overflow: hidden;
        }
        @media (min-width: 768px) { .btn-control { padding: 1.5rem 0; } }
        
        .btn-control.defend { border-color: #3b82f6; color: #bfdbfe; }
        .btn-control.special { border-color: #a855f7; color: #d8b4fe; }
        
        .btn-control .icon { font-size: 1.875rem; z-index: 10; position: relative; }
        .btn-control .label { font-size: 1.125rem; font-weight: bold; z-index: 10; position: relative; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
        .btn-control .key { font-size: 0.75rem; color: #9ca3af; z-index: 10; position: relative; }
        .btn-control.defend .key { color: rgba(96, 165, 250, 0.7); }
        .btn-control.special .key { color: rgba(216, 180, 254, 0.7); }

        #special-gauge-bg {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%;
            height: 0%;
            background-color: rgba(147, 51, 234, 0.6);
            transition: height 0.2s;
            z-index: 0;
        }
        .ready-pulse {
            animation: readyPulse 1.5s infinite;
            border-color: #facc15 !important;
        }
        @keyframes readyPulse {
            0%, 100% { box-shadow: 0 0 10px rgba(250, 204, 21, 0.5); }
            50% { box-shadow: 0 0 25px rgba(250, 204, 21, 1); }
        }

        /* --- アニメーション関連 --- */
        /* プレイヤーの攻撃 */
        @keyframes dash-right {
            0% { transform: translateX(0) rotate(0deg); }
            40% { transform: translateX(120px) rotate(15deg) scale(1.1); }
            100% { transform: translateX(0) rotate(0deg); }
        }
        .anim-dash-right { animation: dash-right 0.3s ease-in-out forwards; }

        /* 敵の攻撃 */
        @keyframes dash-left {
            0% { transform: translateX(0) scaleX(-1) rotate(0deg); }
            40% { transform: translateX(-120px) scaleX(-1) rotate(-15deg) scale(1.1); }
            100% { transform: translateX(0) scaleX(-1) rotate(0deg); }
        }
        .anim-dash-left { animation: dash-left 0.4s ease-in-out forwards; }

        /* 被弾揺れ */
        @keyframes hit-shake {
            0% { transform: translateX(0); filter: brightness(1); }
            20% { transform: translateX(-15px); filter: brightness(2) sepia(1) hue-rotate(-50deg) saturate(5); }
            40% { transform: translateX(15px); filter: brightness(2) sepia(1) hue-rotate(-50deg) saturate(5); }
            60% { transform: translateX(-10px); filter: brightness(1); }
            80% { transform: translateX(10px); filter: brightness(1); }
            100% { transform: translateX(0); filter: brightness(1); }
        }
        .anim-hit { animation: hit-shake 0.4s ease-in-out forwards; }
        
        /* 敵の被弾 (反転維持) */
        @keyframes enemy-hit-shake {
            0% { transform: translateX(0) scaleX(-1); filter: brightness(1); }
            20% { transform: translateX(15px) scaleX(-1); filter: brightness(2) sepia(1) hue-rotate(-50deg) saturate(5); }
            40% { transform: translateX(-15px) scaleX(-1); filter: brightness(2) sepia(1) hue-rotate(-50deg) saturate(5); }
            60% { transform: translateX(10px) scaleX(-1); filter: brightness(1); }
            80% { transform: translateX(-10px) scaleX(-1); filter: brightness(1); }
            100% { transform: translateX(0) scaleX(-1); filter: brightness(1); }
        }
        .anim-enemy-hit { animation: enemy-hit-shake 0.4s ease-in-out forwards; }

        /* 画面揺れ */
        @keyframes screen-shake {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-5px, 5px); }
            40% { transform: translate(5px, -5px); }
            60% { transform: translate(-5px, -5px); }
            80% { transform: translate(5px, 5px); }
            100% { transform: translate(0, 0); }
        }
        .anim-screen-shake { animation: screen-shake 0.3s ease-in-out; }

        /* 呼吸 */
        @keyframes breathe {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .idle { animation: breathe 3s infinite ease-in-out; }
        .idle-enemy { animation: breathe 3s infinite ease-in-out; animation-delay: 1.5s; transform: scaleX(-1); }

        /* --- ポップアップ・カットイン --- */
        .damage-text {
            position: fixed;
            font-weight: 900;
            font-size: 3rem;
            z-index: 100;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            font-family: 'Cinzel', serif;
            text-shadow: 3px 3px 0 #000, -1px -1px 0 #000, 3px -1px 0 #000, -1px 3px 0 #000;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5); opacity: 1; }
            20% { transform: translateY(-20px) scale(1.2); opacity: 1; }
            100% { transform: translateY(-80px) scale(1); opacity: 0; }
        }

        .cutin {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.5rem;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 40;
            white-space: nowrap;
            filter: drop-shadow(0 0 10px rgba(0,0,0,1));
        }
        @media (min-width: 768px) { .cutin { font-size: 4rem; } }
        .cutin.show { opacity: 1; }
        
        .text-color-green { color: #86efac; }
        .text-color-blue { color: #93c5fd; }
        .text-color-red { color: #fca5a5; }

        /* --- リザルト画面 --- */
        .result-title {
            font-size: 4.5rem;
            margin-bottom: 1rem;
            text-align: center;
        }
        .result-title.win {
            color: #facc15;
            filter: drop-shadow(0 0 20px #facc15);
        }
        .result-title.lose {
            color: #ef4444;
            filter: drop-shadow(0 0 20px #ef4444);
        }
        .result-desc {
            font-size: 1.5rem;
            color: #e5e7eb;
            margin-bottom: 3rem;
            text-align: center;
        }
    </style>
</head>
<body id="game-body" onkeydown="handleKeyDown(event)">

    <!-- 背景エフェクト -->
    <div class="bg-gradient"></div>
    <div id="stars-container" class="stars"></div>
    
    <!-- 必殺技時の暗転オーバーレイ -->
    <div id="special-overlay"></div>

    <!-- ================= タイトル画面 ================= -->
    <div id="screen-title" class="screen">
        <div class="idle">
            <p class="title-sub font-magic">REALTIME BATTLE</p>
            <h1 class="title-main font-magic">DURIAN FIGHTER</h1>
        </div>
        <button onclick="showScreen('screen-select')" class="btn-magic btn-large font-magic">
            FIGHT START
        </button>
    </div>

    <!-- ================= キャラクター選択画面 ================= -->
    <div id="screen-select" class="screen screen-dark hidden">
        <h2 class="select-title font-magic">Select Your Fighter</h2>
        
        <div class="select-grid">
            <!-- プリンセス -->
            <div onclick="selectCharacter('princess')" class="glass-panel char-card">
                <div class="char-icon">👸</div>
                <div class="char-name">プリンセス</div>
                <div class="char-desc">必殺: 大回復</div>
            </div>
            <!-- 魔法使い -->
            <div onclick="selectCharacter('wizard')" class="glass-panel char-card blue">
                <div class="char-icon">🧙‍♂️</div>
                <div class="char-name blue">魔法使い</div>
                <div class="char-desc">必殺: メテオ(大ダメージ)</div>
            </div>
            <!-- 野獣 -->
            <div onclick="selectCharacter('beast')" class="glass-panel char-card red">
                <div class="char-icon">🦁</div>
                <div class="char-name red">野獣</div>
                <div class="char-desc">必殺: 突進＆防御UP</div>
            </div>
        </div>
    </div>

    <!-- ================= バトル画面 ================= -->
    <div id="screen-battle" class="screen hidden">
        
        <!-- 上部：HUD（体力ゲージ等） -->
        <div class="hud">
            <!-- プレイヤー情報 -->
            <div class="hud-side">
                <div class="hud-header">
                    <div id="player-name" class="hud-name font-magic">Player</div>
                </div>
                <div class="hp-border player">
                    <div id="player-hp-bar" class="hp-bar player"></div>
                </div>
            </div>

            <!-- 中央 VS -->
            <div class="hud-center font-magic">VS</div>

            <!-- 敵情報 -->
            <div class="hud-side">
                <div class="hud-header reverse">
                    <div id="enemy-name" class="hud-name enemy font-magic">Villain Apple</div>
                </div>
                <div class="hp-border enemy">
                    <div id="enemy-hp-bar" class="hp-bar enemy"></div>
                </div>
            </div>
        </div>

        <!-- 中央：闘技場（キャラクター立ち絵） -->
        <div class="arena">
            
            <!-- プレイヤー -->
            <div class="sprite-wrapper">
                <div id="player-shield" class="shield-effect shield-player"></div>
                <div id="player-sprite" class="sprite idle">👸</div>
            </div>

            <!-- 敵 -->
            <div class="sprite-wrapper enemy">
                <div id="enemy-shield" class="shield-effect shield-enemy"></div>
                <div id="enemy-sprite" class="sprite idle-enemy scale-x-reverse">🍎</div>
            </div>

            <!-- カットイン表示用 -->
            <div id="cutin-text" class="cutin font-magic">SPECIAL MOVE!</div>
        </div>

        <!-- 下部：コントロールパネル -->
        <div class="controls-container">
            <div class="controls">
                
                <div id="btn-attack" onpointerdown="doAttack()" class="btn-magic glass-panel btn-control">
                    <span class="icon">👊</span>
                    <span class="label">攻撃</span>
                    <span class="key">Key: A</span>
                </div>
                
                <div id="btn-defend" onpointerdown="doDefend()" class="btn-magic glass-panel btn-control defend">
                    <span class="icon">🛡️</span>
                    <span class="label">防御</span>
                    <span class="key">Key: S</span>
                </div>
                
                <div id="btn-special" onpointerdown="doSpecial()" class="glass-panel btn-control special">
                    <div id="special-gauge-bg"></div>
                    <span class="icon">✨</span>
                    <span class="label">必殺技</span>
                    <span class="key">Key: D</span>
                </div>

            </div>
        </div>
    </div>

    <!-- ================= 結果画面 ================= -->
    <div id="screen-result" class="screen screen-dark hidden">
        <h2 id="result-title" class="result-title font-magic">K.O.</h2>
        <p id="result-desc" class="result-desc"></p>
        
        <button onclick="resetGame()" class="btn-magic btn-large font-magic">
            タイトルへ戻る
        </button>
    </div>

    <script>
        // --- 背景の星屑生成 ---
        function createStars() {
            const container = document.getElementById('stars-container');
            for (let i = 0; i < 50; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 3 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.animationDuration = `${Math.random() * 3 + 2}s`;
                star.style.animationDelay = `${Math.random() * 2}s`;
                container.appendChild(star);
            }
        }
        createStars();

        // --- データ定義 ---
        const characters = {
            princess: { id: 'princess', name: 'プリンセス', icon: '👸', maxHp: 150, atk: 15 },
            wizard:   { id: 'wizard',   name: '魔法使い',   icon: '🧙‍♂️', maxHp: 120, atk: 25 },
            beast:    { id: 'beast',    name: '野獣',       icon: '🦁', maxHp: 200, atk: 12 }
        };

        const enemyTemplate = {
            name: 'ヴィラン・アップル',
            icon: '🍎',
            maxHp: 300,
            atk: 18
        };

        // --- ゲーム状態管理 ---
        let player = null;
        let enemy = null;
        let isBattleActive = false;
        
        let pIsActioning = false;
        let pIsDefending = false;
        let pSpecialCharge = 0; // 0 to 100
        let pDefenseBuff = false; // 野獣用バフ

        let eIsActioning = false;
        let eIsDefending = false;
        let enemyAiLoopId = null;
        let chargeIntervalId = null;

        // --- 画面切り替え ---
        function showScreen(screenId) {
            ['screen-title', 'screen-select', 'screen-battle', 'screen-result'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(screenId).classList.remove('hidden');
        }

        function resetGame() {
            isBattleActive = false;
            clearTimeout(enemyAiLoopId);
            clearInterval(chargeIntervalId);
            showScreen('screen-title');
        }

        // --- ゲーム開始 ---
        function selectCharacter(charId) {
            player = { ...characters[charId], hp: characters[charId].maxHp };
            enemy = { ...enemyTemplate, hp: enemyTemplate.maxHp };
            
            pSpecialCharge = 0;
            pIsActioning = false;
            pIsDefending = false;
            pDefenseBuff = false;
            eIsActioning = false;
            eIsDefending = false;
            
            // UI初期化
            document.getElementById('player-name').innerText = player.name;
            document.getElementById('player-sprite').innerText = player.icon;
            document.getElementById('enemy-name').innerText = enemy.name;
            document.getElementById('enemy-sprite').innerText = enemy.icon;
            
            document.getElementById('player-sprite').className = 'sprite idle';
            document.getElementById('enemy-sprite').className = 'sprite idle-enemy scale-x-reverse';
            document.getElementById('player-shield').style.opacity = '0';
            document.getElementById('enemy-shield').style.opacity = '0';

            updateHUD();
            showScreen('screen-battle');
            
            isBattleActive = true;
            
            // 敵のAI起動
            startEnemyAI();

            // 必殺技ゲージの自動チャージ（1秒に5%）
            chargeIntervalId = setInterval(() => {
                if(!isBattleActive) return;
                addSpecialCharge(5);
            }, 1000);
        }

        // --- HUD更新 ---
        function updateHUD() {
            // HP制限
            if(player.hp < 0) player.hp = 0;
            if(player.hp > player.maxHp) player.hp = player.maxHp;
            if(enemy.hp < 0) enemy.hp = 0;

            const pPer = (player.hp / player.maxHp) * 100;
            const ePer = (enemy.hp / enemy.maxHp) * 100;
            
            document.getElementById('player-hp-bar').style.width = `${pPer}%`;
            document.getElementById('enemy-hp-bar').style.width = `${ePer}%`;

            // 必殺ゲージ更新
            const specialBg = document.getElementById('special-gauge-bg');
            const btnSpecial = document.getElementById('btn-special');
            specialBg.style.height = `${pSpecialCharge}%`;
            
            if(pSpecialCharge >= 100) {
                btnSpecial.classList.add('ready-pulse');
            } else {
                btnSpecial.classList.remove('ready-pulse');
            }
        }

        function addSpecialCharge(amount) {
            if(pSpecialCharge >= 100) return;
            pSpecialCharge = Math.min(100, pSpecialCharge + amount);
            updateHUD();
        }

        // --- フローティングダメージ表示 ---
        function spawnDamageText(targetElId, text, type) {
            const target = document.getElementById(targetElId);
            const rect = target.getBoundingClientRect();
            
            const div = document.createElement('div');
            div.className = 'damage-text';
            div.innerText = text;
            
            if(type === 'player-dmg') div.style.color = '#ef4444'; // 赤
            else if(type === 'enemy-dmg') div.style.color = '#ffffff'; // 白
            else if(type === 'guard') div.style.color = '#3b82f6'; // 青
            else if(type === 'heal') div.style.color = '#4ade80'; // 緑
            else if(type === 'critical') { div.style.color = '#facc15'; div.style.fontSize = '4rem'; } // 黄色大

            // 少しランダムに散らす
            const offsetX = (Math.random() - 0.5) * 80;
            div.style.left = `${rect.left + rect.width/2 + offsetX}px`;
            // 高さは固定気味
            div.style.top = `${rect.top + 50}px`;
            
            document.body.appendChild(div);
            
            setTimeout(() => div.remove(), 1000);
        }

        // --- カットイン表示 ---
        function showCutin(text, colorClass) {
            const cutin = document.getElementById('cutin-text');
            cutin.innerText = text;
            cutin.className = `cutin font-magic show ${colorClass}`;
            
            setTimeout(() => {
                cutin.classList.remove('show');
            }, 1000);
        }

        // ================= アクション（プレイヤー） =================
        function handleKeyDown(e) {
            if(!isBattleActive) return;
            if(e.key.toLowerCase() === 'a' || e.key === 'ArrowLeft') doAttack();
            if(e.key.toLowerCase() === 's' || e.key === 'ArrowDown') doDefend();
            if(e.key.toLowerCase() === 'd' || e.key === 'ArrowRight') doSpecial();
        }

        function triggerAnim(id, animClass, duration) {
            const el = document.getElementById(id);
            // リセット用
            el.classList.remove('idle', 'idle-enemy', 'anim-dash-right', 'anim-dash-left', 'anim-hit', 'anim-enemy-hit');
            void el.offsetWidth; // reflow
            el.classList.add(animClass);
            
            setTimeout(() => {
                el.classList.remove(animClass);
                // 待機アニメーションに戻す（敵は反転付き）
                if(id === 'enemy-sprite') el.classList.add('idle-enemy');
                else el.classList.add('idle');
            }, duration);
        }

        function doAttack() {
            if(!isBattleActive || pIsActioning) return;
            pIsActioning = true;
            
            // 防御解除
            pIsDefending = false;
            document.getElementById('player-shield').style.opacity = '0';
            
            // 突進アニメーション
            triggerAnim('player-sprite', 'anim-dash-right', 300);

            // ヒット判定 (アニメーションの中間くらいで発生)
            setTimeout(() => {
                if(!isBattleActive) return;

                let dmg = Math.floor(player.atk * (0.8 + Math.random() * 0.4));
                let isCrit = Math.random() < 0.1;
                if(isCrit) dmg = Math.floor(dmg * 1.5);

                if(eIsDefending) {
                    dmg = Math.floor(dmg * 0.3); // ガード時70%カット
                    spawnDamageText('enemy-sprite', 'GUARD', 'guard');
                } else {
                    triggerAnim('enemy-sprite', 'anim-enemy-hit', 400);
                    spawnDamageText('enemy-sprite', dmg, isCrit ? 'critical' : 'enemy-dmg');
                }
                
                enemy.hp -= dmg;
                addSpecialCharge(15); // 攻撃でチャージ
                updateHUD();
                checkWin();

            }, 150);

            // アクション終了
            setTimeout(() => { pIsActioning = false; }, 350);
        }

        function doDefend() {
            if(!isBattleActive || pIsActioning) return;
            pIsActioning = true;
            pIsDefending = true;
            
            document.getElementById('player-shield').style.opacity = '1';
            
            // 約1秒間ガードを維持
            setTimeout(() => {
                pIsDefending = false;
                document.getElementById('player-shield').style.opacity = '0';
                pIsActioning = false; // 次の行動可能に
            }, 800);
        }

        function doSpecial() {
            if(!isBattleActive || pIsActioning || pSpecialCharge < 100) return;
            pIsActioning = true;
            pSpecialCharge = 0;
            updateHUD();

            pIsDefending = false;
            document.getElementById('player-shield').style.opacity = '0';

            // 画面暗転エフェクト
            const overlay = document.getElementById('special-overlay');
            overlay.classList.add('show');
            
            // 画面を揺らす
            document.getElementById('game-body').classList.add('anim-screen-shake');

            setTimeout(() => {
                // キャラ別の技発動
                if(player.id === 'princess') {
                    showCutin("王家の癒し！", "text-color-green");
                    const heal = Math.floor(player.maxHp * 0.5);
                    player.hp += heal;
                    spawnDamageText('player-sprite', `+${heal}`, 'heal');
                    
                } else if(player.id === 'wizard') {
                    showCutin("メテオ・ストライク！", "text-color-blue");
                    triggerAnim('player-sprite', 'anim-dash-right', 500);
                    setTimeout(() => {
                        triggerAnim('enemy-sprite', 'anim-enemy-hit', 600);
                        const dmg = player.atk * 4;
                        enemy.hp -= dmg;
                        spawnDamageText('enemy-sprite', dmg, 'critical');
                        checkWin();
                    }, 200);

                } else if(player.id === 'beast') {
                    showCutin("ビースト・ラッシュ！", "text-color-red");
                    pDefenseBuff = true; // しばらく防御力UP
                    triggerAnim('player-sprite', 'anim-dash-right', 400);
                    setTimeout(() => {
                        triggerAnim('enemy-sprite', 'anim-enemy-hit', 400);
                        const dmg = player.atk * 3;
                        enemy.hp -= dmg;
                        spawnDamageText('enemy-sprite', dmg, 'critical');
                        checkWin();
                    }, 150);
                    // バフは5秒で切れる
                    setTimeout(() => { pDefenseBuff = false; }, 5000);
                }

                updateHUD();
                
                // 状態リセット
                setTimeout(() => {
                    overlay.classList.remove('show');
                    document.getElementById('game-body').classList.remove('anim-screen-shake');
                    pIsActioning = false;
                }, 1000);

            }, 200);
        }

        // ================= アクション（敵AI） =================
        function startEnemyAI() {
            function loop() {
                if(!isBattleActive) return;
                
                // ランダムに攻撃・防御・待機を決定
                const actionChoice = Math.random();
                if(!eIsActioning) {
                    if(actionChoice < 0.5) {
                        enemyAttack();
                    } else if(actionChoice < 0.7) {
                        enemyDefend();
                    }
                }
                
                // 次の行動までのインターバル(1〜2.5秒)
                const nextTime = 1000 + Math.random() * 1500;
                enemyAiLoopId = setTimeout(loop, nextTime);
            }
            loop(); // ループ開始
        }

        function enemyAttack() {
            if(eIsActioning || !isBattleActive) return;
            eIsActioning = true;
            
            // 防御解除
            eIsDefending = false;
            document.getElementById('enemy-shield').style.opacity = '0';
            
            // 突進アニメーション
            triggerAnim('enemy-sprite', 'anim-dash-left', 400);

            setTimeout(() => {
                if(!isBattleActive) return;

                let dmg = Math.floor(enemy.atk * (0.8 + Math.random() * 0.4));
                // 野獣バフ中のダメージ半減
                if(pDefenseBuff) dmg = Math.floor(dmg * 0.5);

                if(pIsDefending) {
                    dmg = Math.floor(dmg * 0.3); // ガード時70%カット
                    spawnDamageText('player-sprite', 'GUARD', 'guard');
                } else {
                    triggerAnim('player-sprite', 'anim-hit', 400);
                    spawnDamageText('player-sprite', dmg, 'player-dmg');
                }
                
                player.hp -= dmg;
                addSpecialCharge(5); // 被弾でも少しチャージ
                updateHUD();
                checkWin();

            }, 200);

            // アクション終了
            setTimeout(() => { eIsActioning = false; }, 500);
        }

        function enemyDefend() {
            if(eIsActioning || !isBattleActive) return;
            eIsActioning = true;
            eIsDefending = true;
            
            document.getElementById('enemy-shield').style.opacity = '1';
            
            // 敵は少し長めにガード
            setTimeout(() => {
                eIsDefending = false;
                document.getElementById('enemy-shield').style.opacity = '0';
                eIsActioning = false;
            }, 1000);
        }

        // ================= 勝敗判定 =================
        function checkWin() {
            if(player.hp <= 0 && enemy.hp <= 0) {
                endGame('draw');
            } else if(player.hp <= 0) {
                endGame('lose');
            } else if(enemy.hp <= 0) {
                endGame('win');
            }
        }

        function endGame(result) {
            if(!isBattleActive) return;
            isBattleActive = false; // 先行して入力をブロック
            
            clearTimeout(enemyAiLoopId);
            clearInterval(chargeIntervalId);

            // リザルト画面への遷移
            setTimeout(() => {
                showScreen('screen-result');
                const title = document.getElementById('result-title');
                const desc = document.getElementById('result-desc');
                
                if(result === 'win') {
                    title.innerText = 'YOU WIN!';
                    title.className = 'result-title font-magic win';
                    desc.innerText = '見事ヴィランを打ち倒した！';
                } else if(result === 'lose') {
                    title.innerText = 'YOU LOSE...';
                    title.className = 'result-title font-magic lose';
                    desc.innerText = '力及ばず、倒れてしまった...';
                } else {
                    title.innerText = 'DRAW';
                    title.className = 'result-title font-magic';
                    desc.innerText = '激闘の末、相打ちとなった...';
                }
            }, 1000); // 倒れた余韻を残すための1秒ディレイ
        }
    </script>
</body>
</html>
