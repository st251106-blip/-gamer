<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DURIAN FIGHTER 〜魔法の果実〜</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* --- ベーススタイル --- */
        :root {
            --disney-gold: #FFD700;
            --disney-gold-glow: rgba(255, 215, 0, 0.6);
            --disney-blue: #090d16;
            --panel-border: rgba(255, 215, 0, 0.45);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Noto Serif JP', serif;
            background-color: var(--disney-blue);
            color: white;
            overflow: hidden;
            user-select: none;
            touch-action: manipulation; /* スマホでのズーム防止 */
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .font-magic {
            font-family: 'Cinzel', serif;
        }
        .hidden {
            display: none !important;
        }
        
        /* --- 背景・エフェクト --- */
        .bg-gradient {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(ellipse at center, rgba(15, 23, 42, 0.8) 0%, rgba(9, 13, 22, 0.95) 60%, #020408 100%);
            z-index: 0;
            pointer-events: none;
        }
        .stars {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle infinite ease-in-out;
            box-shadow: 0 0 6px #fff, 0 0 12px #FFD700;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.1; transform: scale(0.4); }
            50% { opacity: 0.9; transform: scale(1.3); }
        }

        #special-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 30;
            background: radial-gradient(circle, rgba(88, 28, 135, 0.6) 0%, rgba(0, 0, 0, 0.9) 100%);
            mix-blend-mode: hard-light;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
        }
        #special-overlay.show {
            opacity: 1;
        }

        /* --- 画面レイアウト --- */
        .screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s;
        }
        .screen-dark {
            background-color: rgba(2, 4, 8, 0.9);
            background-image: radial-gradient(circle, rgba(15, 23, 42, 0.6) 0%, #020408 100%);
        }

        /* --- タイトル画面 --- */
        .title-sub {
            color: #facc15;
            font-size: 1.25rem;
            letter-spacing: 0.4em;
            margin-bottom: 0.75rem;
            text-align: center;
            text-shadow: 0 0 10px rgba(250, 204, 21, 0.6);
        }
        .title-main {
            font-size: 3.5rem;
            font-weight: 700;
            background: linear-gradient(to bottom, #fff5c0 0%, #facc15 40%, #ca8a04 80%, #854d0e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(255,215,0,0.45));
            margin-bottom: 3.5rem;
            text-align: center;
            letter-spacing: 0.05em;
        }
        @media (min-width: 768px) { .title-main { font-size: 5.5rem; } }

        /* --- 汎用ボタン・パネル --- */
        .glass-panel {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.85) 0%, rgba(9, 13, 22, 0.95) 100%);
            backdrop-filter: blur(12px);
            border: 1.5px solid var(--panel-border);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.75), inset 0 0 15px rgba(255, 215, 0, 0.1);
            border-radius: 1rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .glass-panel:hover {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.9) 0%, rgba(15, 23, 42, 0.95) 100%);
            border-color: var(--disney-gold);
            box-shadow: 0 12px 40px 0 rgba(255, 215, 0, 0.15), inset 0 0 20px rgba(255, 215, 0, 0.15);
        }
        .btn-magic {
            background: linear-gradient(135deg, rgba(255,215,0,0.25) 0%, rgba(255,215,0,0.02) 100%);
            border: 2px solid var(--disney-gold);
            box-shadow: 0 0 15px rgba(255,215,0,0.25), inset 0 0 10px rgba(255, 215, 0, 0.1);
            border-radius: 9999px;
            color: #fffbdf;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-magic:hover {
            box-shadow: 0 0 25px rgba(255,215,0,0.55), inset 0 0 15px rgba(255, 215, 0, 0.2);
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
        }
        .btn-magic:active {
            transform: scale(0.95);
            background: rgba(255,215,0,0.35);
        }
        .btn-large {
            padding: 1.25rem 3.5rem;
            font-size: 1.5rem;
            letter-spacing: 0.15em;
        }

        /* --- キャラ選択画面 --- */
        .select-title {
            font-size: 2.25rem;
            color: #fde047;
            margin-bottom: 2.5rem;
            text-align: center;
            text-shadow: 0 0 15px rgba(253, 224, 71, 0.4);
            letter-spacing: 0.05em;
        }
        .select-grid {
            display: flex;
            gap: 2rem;
            width: 100%;
            max-width: 60rem;
            justify-content: center;
            padding: 0 1.5rem;
        }
        .char-card {
            flex: 1;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-top: 4px solid var(--disney-gold);
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .char-card.blue { border-top-color: #3b82f6; }
        .char-card.red { border-top-color: #ef4444; }
        
        .char-preview-box {
            width: 100px;
            height: 100px;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .char-preview-box svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
        }

        .char-name { font-size: 1.35rem; font-weight: bold; color: #fef08a; letter-spacing: 0.05em; }
        .char-name.blue { color: #60a5fa; }
        .char-name.red { color: #f87171; }
        .char-desc { font-size: 0.85rem; color: #d1d5db; margin-top: 0.75rem; text-align: center; line-height: 1.5; }

        /* --- バトル画面 UI --- */
        #screen-battle {
            z-index: 10;
            justify-content: space-between;
        }
        
        /* HUD */
        .hud {
            width: 100%;
            padding: 1.75rem 1.5rem 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1.5rem;
            z-index: 20;
        }
        .hud-side { width: 42%; }
        .hud-center {
            width: 16%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 2.25rem;
            color: var(--disney-gold);
            filter: drop-shadow(0 0 8px var(--disney-gold-glow));
            line-height: 1.1;
        }
        .stage-text {
            font-size: 1.1rem;
            color: #fde047;
            margin-bottom: 0.35rem;
            letter-spacing: 0.15em;
            text-shadow: 0 0 8px rgba(253, 224, 71, 0.5);
            font-weight: bold;
        }
        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 0.35rem;
        }
        .hud-header.reverse { flex-direction: row-reverse; }
        .hud-name {
            font-size: 1.3rem;
            font-weight: bold;
            color: #fef08a;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .hud-name.enemy { color: #d8b4fe; }
        
        .hp-border {
            width: 100%;
            height: 1.875rem;
            background-color: #270505;
            border: 2.5px solid var(--panel-border);
            border-radius: 0.5rem;
            padding: 2px;
            display: flex;
            box-shadow: 0 0 15px rgba(0,0,0,0.9), inset 0 0 8px rgba(0,0,0,0.8);
        }
        .hp-border.player { justify-content: flex-end; border-color: rgba(255, 215, 0, 0.5); }
        .hp-border.enemy { justify-content: flex-start; border-color: rgba(168, 85, 247, 0.5); }
        
        .hp-bar {
            height: 100%;
            width: 100%;
            border-radius: 0.25rem;
            transition: width 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.25);
        }
        .hp-bar.player { background: linear-gradient(to left, #fde047, #eab308); filter: drop-shadow(0 0 4px rgba(234, 179, 8, 0.6)); }
        .hp-bar.enemy { background: linear-gradient(to right, #f87171, #dc2626); filter: drop-shadow(0 0 4px rgba(220, 38, 38, 0.6)); }

        /* 闘技場 */
        .arena {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 4rem 2.5rem;
            z-index: 10;
            width: 100%;
            max-width: 72rem;
            margin: 0 auto;
        }
        
        .sprite-wrapper { position: relative; z-index: 20; width: 180px; height: 180px; display: flex; align-items: flex-end; justify-content: center; }
        .sprite-wrapper.enemy { z-index: 10; }
        
        .sprite {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 15px 20px rgba(0,0,0,0.6));
            transform-origin: bottom;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }
        .sprite svg {
            width: 100%;
            height: 100%;
        }
        
        @media (min-width: 768px) {
            .sprite-wrapper { width: 280px; height: 280px; }
        }
        .scale-x-reverse { transform: scaleX(-1); }

        .shield-effect {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            transform: scale(1.3);
            filter: blur(12px);
            opacity: 0;
            transition: opacity 0.25s ease-in-out;
            pointer-events: none;
            box-shadow: inset 0 0 30px rgba(255,255,255,0.4);
        }
        .shield-player { background-color: rgba(59, 130, 246, 0.45); border: 2px solid #60a5fa; }
        .shield-enemy { background-color: rgba(168, 85, 247, 0.45); border: 2px solid #c084fc; }

        /* コントロールパネル */
        .controls-container {
            padding: 1.25rem;
            background: linear-gradient(to top, rgba(2,4,8,1) 80%, rgba(2,4,8,0.7) 100%);
            z-index: 20;
            border-top: 1px solid rgba(255, 215, 0, 0.2);
            width: 100%;
        }
        @media (min-width: 768px) { .controls-container { padding: 2rem; } }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 1.25rem;
            max-width: 52rem;
            margin: 0 auto;
            width: 100%;
        }
        .btn-control {
            flex: 1;
            padding: 1.25rem 0;
            border-radius: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0,0,0,0.5), inset 0 0 10px rgba(255, 215, 0, 0.05);
        }
        @media (min-width: 768px) { .btn-control { padding: 1.75rem 0; } }
        
        .btn-control.defend { border-color: #3b82f6; color: #bfdbfe; }
        .btn-control.defend:hover { border-color: #60a5fa; box-shadow: 0 0 15px rgba(59,130,246,0.3); }
        .btn-control.special { border-color: #a855f7; color: #d8b4fe; }
        .btn-control.special:hover { border-color: #c084fc; box-shadow: 0 0 15px rgba(168,85,247,0.3); }
        
        .btn-control .icon { font-size: 2rem; z-index: 10; position: relative; }
        .btn-control .label { font-size: 1.15rem; font-weight: bold; z-index: 10; position: relative; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8)); letter-spacing: 0.1em; }
        .btn-control .key { font-size: 0.75rem; color: #9ca3af; z-index: 10; position: relative; }
        .btn-control.defend .key { color: rgba(147, 197, 253, 0.8); }
        .btn-control.special .key { color: rgba(216, 180, 254, 0.8); }

        #special-gauge-bg {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%;
            height: 0%;
            background: linear-gradient(to top, rgba(147, 51, 234, 0.8) 0%, rgba(192, 132, 252, 0.5) 100%);
            transition: height 0.3s ease;
            z-index: 0;
        }
        .ready-pulse {
            animation: readyPulse 1.5s infinite;
            border-color: #facc15 !important;
        }
        @keyframes readyPulse {
            0%, 100% { box-shadow: 0 0 12px rgba(250, 204, 21, 0.4), inset 0 0 8px rgba(250, 204, 21, 0.2); }
            50% { box-shadow: 0 0 30px rgba(250, 204, 21, 0.8), inset 0 0 15px rgba(250, 204, 21, 0.4); }
        }

        /* --- アニメーション関連 --- */
        /* プレイヤーの攻撃 */
        @keyframes dash-right {
            0% { transform: translateX(0) rotate(0deg); }
            35% { transform: translateX(140px) rotate(12deg) scale(1.15); }
            100% { transform: translateX(0) rotate(0deg); }
        }
        .anim-dash-right { animation: dash-right 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards; }

        /* 敵の攻撃 */
        @keyframes dash-left {
            0% { transform: translateX(0) scaleX(-1) rotate(0deg); }
            35% { transform: translateX(-140px) scaleX(-1) rotate(-12deg) scale(1.15); }
            100% { transform: translateX(0) scaleX(-1) rotate(0deg); }
        }
        .anim-dash-left { animation: dash-left 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards; }

        /* 被弾揺れ */
        @keyframes hit-shake {
            0% { transform: translateX(0); filter: brightness(1); }
            15% { transform: translateX(-20px); filter: brightness(1.8) sepia(0.8) hue-rotate(-50deg) saturate(3); }
            30% { transform: translateX(20px); filter: brightness(1.8) sepia(0.8) hue-rotate(-50deg) saturate(3); }
            45% { transform: translateX(-15px); filter: brightness(1.3); }
            60% { transform: translateX(15px); filter: brightness(1.3); }
            80% { transform: translateX(-8px); filter: brightness(1.1); }
            100% { transform: translateX(0); filter: brightness(1); }
        }
        .anim-hit { animation: hit-shake 0.45s ease-in-out forwards; }
        
        /* 敵の被弾 (反転維持) */
        @keyframes enemy-hit-shake {
            0% { transform: translateX(0) scaleX(-1); filter: brightness(1); }
            15% { transform: translateX(20px) scaleX(-1); filter: brightness(1.8) sepia(0.8) hue-rotate(-50deg) saturate(3); }
            30% { transform: translateX(-20px) scaleX(-1); filter: brightness(1.8) sepia(0.8) hue-rotate(-50deg) saturate(3); }
            45% { transform: translateX(15px) scaleX(-1); filter: brightness(1.3); }
            60% { transform: translateX(-15px) scaleX(-1); filter: brightness(1.3); }
            80% { transform: translateX(8px) scaleX(-1); filter: brightness(1.1); }
            100% { transform: translateX(0) scaleX(-1); filter: brightness(1); }
        }
        .anim-enemy-hit { animation: enemy-hit-shake 0.45s ease-in-out forwards; }

        /* 画面揺れ */
        @keyframes screen-shake {
            0% { transform: translate(0, 0); }
            15% { transform: translate(-8px, 8px); }
            30% { transform: translate(8px, -8px); }
            45% { transform: translate(-8px, -8px); }
            60% { transform: translate(8px, 8px); }
            75% { transform: translate(-4px, 4px); }
            90% { transform: translate(4px, -4px); }
            100% { transform: translate(0, 0); }
        }
        .anim-screen-shake { animation: screen-shake 0.4s ease-in-out; }

        /* 呼吸（上下の揺らぎ） */
        @keyframes breathe {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        .idle { animation: breathe 3.5s infinite ease-in-out; }
        .idle-enemy { animation: breathe 3.5s infinite ease-in-out; animation-delay: 1.75s; transform: scaleX(-1); }

        /* --- ポップアップ・カットイン --- */
        .damage-text {
            position: fixed;
            font-weight: 900;
            font-size: 3.5rem;
            z-index: 100;
            pointer-events: none;
            animation: floatUp 1s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
            font-family: 'Cinzel', serif;
            text-shadow: 4px 4px 0 #000, -2px -2px 0 #000, 4px -2px 0 #000, -2px 4px 0 #000;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.4); opacity: 0; }
            15% { transform: translateY(-30px) scale(1.3); opacity: 1; }
            100% { transform: translateY(-100px) scale(0.9); opacity: 0; }
        }

        .cutin {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.8rem;
            font-weight: bold;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 40;
            white-space: nowrap;
            filter: drop-shadow(0 0 15px rgba(0,0,0,1));
            letter-spacing: 0.1em;
        }
        @media (min-width: 768px) { .cutin { font-size: 4.5rem; } }
        .cutin.show { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
        
        .text-color-green { color: #86efac; text-shadow: 0 0 20px rgba(74, 222, 128, 0.6); }
        .text-color-blue { color: #93c5fd; text-shadow: 0 0 20px rgba(59, 130, 246, 0.6); }
        .text-color-red { color: #fca5a5; text-shadow: 0 0 20px rgba(239, 68, 68, 0.6); }

        /* --- リザルト画面 --- */
        .result-title {
            font-size: 4.5rem;
            margin-bottom: 1rem;
            text-align: center;
            letter-spacing: 0.05em;
        }
        .result-title.win {
            color: #facc15;
            filter: drop-shadow(0 0 25px rgba(250, 204, 21, 0.6));
        }
        .result-title.lose {
            color: #ef4444;
            filter: drop-shadow(0 0 25px rgba(239, 68, 68, 0.6));
        }
        .result-desc {
            font-size: 1.5rem;
            color: #e5e7eb;
            margin-bottom: 3.5rem;
            text-align: center;
            max-width: 32rem;
            padding: 0 1.5rem;
            line-height: 1.6;
        }
    </style>
</head>
<body id="game-body" onkeydown="handleKeyDown(event)">

    <!-- 背景エフェクト -->
    <div class="bg-gradient"></div>
    <div id="stars-container" class="stars"></div>
    
    <!-- 必殺技時の暗転オーバーレイ -->
    <div id="special-overlay"></div>

    <!-- ================= タイトル画面 ================= -->
    <div id="screen-title" class="screen">
        <div class="idle" style="margin-bottom: 2rem;">
            <p class="title-sub font-magic">REALTIME BATTLE</p>
            <h1 class="title-main font-magic">DURIAN FIGHTER</h1>
        </div>
        <button onclick="showScreen('screen-select')" class="btn-magic btn-large font-magic">
            FIGHT START
        </button>
    </div>

    <!-- ================= キャラクター選択画面 ================= -->
    <div id="screen-select" class="screen screen-dark hidden">
        <h2 class="select-title font-magic">Select Your Fighter</h2>
        
        <div class="select-grid">
            <!-- プリンセス -->
            <div onclick="selectCharacter('princess')" class="glass-panel char-card">
                <div class="char-preview-box" id="preview-princess"></div>
                <div class="char-name">プリンセス</div>
                <div class="char-desc">必殺: 王家の癒し<br><span style="color:#4ade80;">最大HPの50%を高速大回復</span></div>
            </div>
            <!-- 魔法使い -->
            <div onclick="selectCharacter('wizard')" class="glass-panel char-card blue">
                <div class="char-preview-box" id="preview-wizard"></div>
                <div class="char-name blue">魔法使い</div>
                <div class="char-desc">必殺: メテオ・ストライク<br><span style="color:#60a5fa;">攻撃力の4倍の超爆絶ダメージ</span></div>
            </div>
            <!-- 野獣 -->
            <div onclick="selectCharacter('beast')" class="glass-panel char-card red">
                <div class="char-preview-box" id="preview-beast"></div>
                <div class="char-name red">野獣</div>
                <div class="char-desc">必殺: ビースト・ラッシュ<br><span style="color:#f87171;">大突撃 & 5秒間受けるダメージ半減</span></div>
            </div>
        </div>
    </div>

    <!-- ================= バトル画面 ================= -->
    <div id="screen-battle" class="screen hidden">
        
        <!-- 上部：HUD（体力ゲージ等） -->
        <div class="hud">
            <!-- プレイヤー情報 -->
            <div class="hud-side">
                <div class="hud-header">
                    <div id="player-name" class="hud-name font-magic">Player</div>
                </div>
                <div class="hp-border player">
                    <div id="player-hp-bar" class="hp-bar player"></div>
                </div>
            </div>

            <!-- 中央 VS -->
            <div class="hud-center font-magic">
                <div class="stage-text">STAGE <span id="stage-display">1</span></div>
                <div>VS</div>
            </div>

            <!-- 敵情報 -->
            <div class="hud-side">
                <div class="hud-header reverse">
                    <div id="enemy-name" class="hud-name enemy font-magic">Villain Apple</div>
                </div>
                <div class="hp-border enemy">
                    <div id="enemy-hp-bar" class="hp-bar enemy"></div>
                </div>
            </div>
        </div>

        <!-- 中央：闘技場（キャラクター立ち絵） -->
        <div class="arena">

                star.style.top = `${Math.random() * 100}%`;
                star.style.animationDuration = `${Math.random() * 3 + 2}s`;

        // キャラクター選択カードのプレビューを表示
        document.getElementById('preview-princess').innerHTML = characterSVGs.princess;
        document.getElementById('preview-wizard').innerHTML = characterSVGs.wizard;
        document.getElementById('preview-beast').innerHTML = characterSVGs.beast;

        // --- データ定義 ---
        const characters = {
            princess: { id: 'princess', name: 'プリンセス', svg: characterSVGs.princess, maxHp: 150, atk: 15 },
            wizard:   { id: 'wizard',   name: '魔法使い',   svg: characterSVGs.wizard, maxHp: 120, atk: 25 },
            beast:    { id: 'beast',    name: '野獣',       svg: characterSVGs.beast, maxHp: 200, atk: 12 }
        };

        const enemiesList = [
            { name: 'ヴィラン・アップル', svg: characterSVGs.apple, maxHp: 300, atk: 18 },
            { name: 'ダーク・バナナ', svg: characterSVGs.banana, maxHp: 500, atk: 25 },
            { name: '魔王ドリアン', svg: characterSVGs.durian, maxHp: 800, atk: 35 }
        ];

        // --- ゲーム状態管理 ---
        let player = null;
        let enemy = null;
        let isBattleActive = false;
        let currentStage = 0;
        
        let pIsActioning = false;
        let pIsDefending = false;
        let pSpecialCharge = 0; // 0 to 100
        let pDefenseBuff = false; // 野獣用バフ

        let eIsActioning = false;
        let eIsDefending = false;
        let enemyAiLoopId = null;
        let chargeIntervalId = null;

        // --- 画面切り替え ---
        function showScreen(screenId) {
            ['screen-title', 'screen-select', 'screen-battle', 'screen-result'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(screenId).classList.remove('hidden');
        }

        function resetGame() {
            isBattleActive = false;
            clearTimeout(enemyAiLoopId);
            clearInterval(chargeIntervalId);
            showScreen('screen-title');
        }

        // --- ゲーム開始 ---
        function selectCharacter(charId) {
            player = { ...characters[charId], hp: characters[charId].maxHp };
            currentStage = 0;
            
            pSpecialCharge = 0;
            pIsActioning = false;
            pIsDefending = false;
            pDefenseBuff = false;
            eIsActioning = false;
            eIsDefending = false;
            
            showScreen('screen-battle');
            setupStage();
        }

        function setupStage() {
            enemy = { ...enemiesList[currentStage], hp: enemiesList[currentStage].maxHp };
            
            // UI初期化
            document.getElementById('player-name').innerText = player.name;
            document.getElementById('player-sprite').innerHTML = player.svg;
            document.getElementById('enemy-name').innerText = enemy.name;
            document.getElementById('enemy-sprite').innerHTML = enemy.svg;
            document.getElementById('stage-display').innerText = currentStage + 1;
            
            document.getElementById('player-sprite').className = 'sprite idle';
            document.getElementById('enemy-sprite').className = 'sprite idle-enemy scale-x-reverse';
            document.getElementById('player-shield').style.opacity = '0';
            document.getElementById('enemy-shield').style.opacity = '0';

            updateHUD();
            isBattleActive = true;
            
            // 敵のAI起動
            startEnemyAI();

            // 必殺技ゲージの自動チャージ（1秒に5%）
            if (chargeIntervalId) clearInterval(chargeIntervalId);
            chargeIntervalId = setInterval(() => {
                if(!isBattleActive) return;
                addSpecialCharge(5);
            }, 1000);
        }

        // --- HUD更新 ---
        function updateHUD() {
            // HP制限
            if(player.hp < 0) player.hp = 0;
            if(player.hp > player.maxHp) player.hp = player.maxHp;
            if(enemy.hp < 0) enemy.hp = 0;

            const pPer = (player.hp / player.maxHp) * 100;
            const ePer = (enemy.hp / enemy.maxHp) * 100;
            
            document.getElementById('player-hp-bar').style.width = `${pPer}%`;
            document.getElementById('enemy-hp-bar').style.width = `${ePer}%`;

            // 必殺ゲージ更新
            const specialBg = document.getElementById('special-gauge-bg');
            const btnSpecial = document.getElementById('btn-special');
            specialBg.style.height = `${pSpecialCharge}%`;
            
            if(pSpecialCharge >= 100) {
                btnSpecial.classList.add('ready-pulse');
            } else {
                btnSpecial.classList.remove('ready-pulse');
            }
        }

        function addSpecialCharge(amount) {
            if(pSpecialCharge >= 100) return;
            pSpecialCharge = Math.min(100, pSpecialCharge + amount);
            updateHUD();
        }

        // --- フローティングダメージ表示 ---
        function spawnDamageText(targetElId, text, type) {
            const target = document.getElementById(targetElId);
            const rect = target.getBoundingClientRect();
            
            const div = document.createElement('div');
            div.className = 'damage-text';
            div.innerText = text;
            
            if(type === 'player-dmg') div.style.color = '#ef4444'; // 赤
            else if(type === 'enemy-dmg') div.style.color = '#ffffff'; // 白
            else if(type === 'guard') div.style.color = '#60a5fa'; // 青
            else if(type === 'heal') div.style.color = '#4ade80'; // 緑
            else if(type === 'critical') { div.style.color = '#facc15'; div.style.fontSize = '4.5rem'; } // 黄色大

            // 少しランダムに散らす
            const offsetX = (Math.random() - 0.5) * 80;
            div.style.left = `${rect.left + rect.width/2 + offsetX}px`;
            // 高さは固定気味
            div.style.top = `${rect.top + 50}px`;
            
            document.body.appendChild(div);
            
            setTimeout(() => div.remove(), 1000);
        }

        // --- カットイン表示 ---
        function showCutin(text, colorClass) {
            const cutin = document.getElementById('cutin-text');
            cutin.innerText = text;
            cutin.className = `cutin font-magic show ${colorClass}`;
            
            setTimeout(() => {
                cutin.classList.remove('show');
            }, 1000);
        }

        // ================= アクション（プレイヤー） =================
        function handleKeyDown(e) {
            if(!isBattleActive) return;
            if(e.key.toLowerCase() === 'a' || e.key === 'ArrowLeft') doAttack();
            if(e.key.toLowerCase() === 's' || e.key === 'ArrowDown') doDefend();
            if(e.key.toLowerCase() === 'd' || e.key === 'ArrowRight') doSpecial();
        }

        function triggerAnim(id, animClass, duration) {
            const el = document.getElementById(id);
            // リセット用
            el.classList.remove('idle', 'idle-enemy', 'anim-dash-right', 'anim-dash-left', 'anim-hit', 'anim-enemy-hit');
            void el.offsetWidth; // reflow
            el.classList.add(animClass);
            
            setTimeout(() => {
                el.classList.remove(animClass);
                // 待機アニメーションに戻す（敵は反転付き）
                if(id === 'enemy-sprite') el.classList.add('idle-enemy');
                else el.classList.add('idle');
            }, duration);
        }

        function doAttack() {
            if(!isBattleActive || pIsActioning) return;
            pIsActioning = true;
            
            // 防御解除
            pIsDefending = false;
            document.getElementById('player-shield').style.opacity = '0';
            
            // 突進アニメーション
            triggerAnim('player-sprite', 'anim-dash-right', 350);

            // ヒット判定 (アニメーションの中間くらいで発生)
            setTimeout(() => {
                if(!isBattleActive) return;

                let dmg = Math.floor(player.atk * (0.8 + Math.random() * 0.4));
                let isCrit = Math.random() < 0.15;
                if(isCrit) dmg = Math.floor(dmg * 1.5);

                if(eIsDefending) {
                    dmg = Math.floor(dmg * 0.3); // ガード時70%カット
                    spawnDamageText('enemy-sprite', 'GUARD', 'guard');
                } else {
                    triggerAnim('enemy-sprite', 'anim-enemy-hit', 450);
                    spawnDamageText('enemy-sprite', dmg, isCrit ? 'critical' : 'enemy-dmg');
                }
                
                enemy.hp -= dmg;
                addSpecialCharge(15); // 攻撃でチャージ
                updateHUD();
                checkWin();

            }, 160);

            // アクション終了
            setTimeout(() => { pIsActioning = false; }, 400);
        }

        function doDefend() {
            if(!isBattleActive || pIsActioning) return;
            pIsActioning = true;
            pIsDefending = true;
            
            document.getElementById('player-shield').style.opacity = '1';
            
            // 約1秒間ガードを維持
            setTimeout(() => {
                pIsDefending = false;
                document.getElementById('player-shield').style.opacity = '0';
                pIsActioning = false; // 次の行動可能に
            }, 800);
        }

        function doSpecial() {
            if(!isBattleActive || pIsActioning || pSpecialCharge < 100) return;
            pIsActioning = true;
            pSpecialCharge = 0;
            updateHUD();

            pIsDefending = false;
            document.getElementById('player-shield').style.opacity = '0';

            // 画面暗転エフェクト
            const overlay = document.getElementById('special-overlay');
            overlay.classList.add('show');
            
            // 画面を揺らす
            document.getElementById('game-body').classList.add('anim-screen-shake');

            setTimeout(() => {
                // キャラ別の技発動
                if(player.id === 'princess') {
                    showCutin("王家の癒し！", "text-color-green");
                    const heal = Math.floor(player.maxHp * 0.5);
                    player.hp += heal;
                    spawnDamageText('player-sprite', `+${heal}`, 'heal');
                    
                } else if(player.id === 'wizard') {
                    showCutin("メテオ・ストライク！", "text-color-blue");
                    triggerAnim('player-sprite', 'anim-dash-right', 500);
                    setTimeout(() => {
                        triggerAnim('enemy-sprite', 'anim-enemy-hit', 600);
                        const dmg = player.atk * 4;
                        enemy.hp -= dmg;
                        spawnDamageText('enemy-sprite', dmg, 'critical');
                        checkWin();
                    }, 200);

                } else if(player.id === 'beast') {
                    showCutin("ビースト・ラッシュ！", "text-color-red");
                    pDefenseBuff = true; // しばらく防御力UP
                    triggerAnim('player-sprite', 'anim-dash-right', 400);
                    setTimeout(() => {
                        triggerAnim('enemy-sprite', 'anim-enemy-hit', 400);
                        const dmg = player.atk * 3;
                        enemy.hp -= dmg;
                        spawnDamageText('enemy-sprite', dmg, 'critical');
                        checkWin();
                    }, 150);
                    
                    // バフは5秒で切れる
                    setTimeout(() => {
                        pDefenseBuff = false;
                    }, 5000);
                }

                updateHUD();

                // エフェクト解除
                setTimeout(() => {
                    overlay.classList.remove('show');
                    document.getElementById('game-body').classList.remove('anim-screen-shake');
                    pIsActioning = false; // 次の行動可能に
                }, 500);
            }, 300); // 暗転後のタメ
        }

        // ================= アクション（敵AI） =================
        function startEnemyAI() {
            function loop() {
                if(!isBattleActive) return;
                
                // アクション間隔(1.2秒〜2.5秒)
                const nextActionTime = 1200 + Math.random() * 1300;
                
                enemyAiLoopId = setTimeout(() => {
                    if(!isBattleActive || eIsActioning) {
                        loop();
                        return;
                    }

                    eIsActioning = true;
                    
                    // 前回の防御状態を解除
                    eIsDefending = false;
                    document.getElementById('enemy-shield').style.opacity = '0';

                    // 攻撃か防御か (70% 攻撃, 30% 防御)
                    if(Math.random() < 0.7) {
                        // 攻撃
                        triggerAnim('enemy-sprite', 'anim-dash-left', 400);
                        
                        setTimeout(() => {
                            if(!isBattleActive) return;
                            
                            let dmg = Math.floor(enemy.atk * (0.8 + Math.random() * 0.4));
                            
                            // 野獣の防御バフ中ならダメージ半減
                            if(pDefenseBuff) dmg = Math.floor(dmg * 0.5);

                            if(pIsDefending) {
                                dmg = Math.floor(dmg * 0.3); // ガード時70%カット
                                spawnDamageText('player-sprite', 'GUARD', 'guard');
                            } else {
                                triggerAnim('player-sprite', 'anim-hit', 450);
                                spawnDamageText('player-sprite', dmg, 'player-dmg');
                            }
                            
                            player.hp -= dmg;
                            updateHUD();
                            checkWin();
                        }, 200);

                        // アクション終了
                        setTimeout(() => { 
                            eIsActioning = false; 
                            loop(); 
                        }, 600);

                    } else {
                        // 防御
                        eIsDefending = true;
                        document.getElementById('enemy-shield').style.opacity = '1';
                        
                        // 約1秒間ガード
                        setTimeout(() => {
                            eIsDefending = false;
                            document.getElementById('enemy-shield').style.opacity = '0';
                            eIsActioning = false;
                            loop();
                        }, 1000);
                    }
                }, nextActionTime);
            }
            
            // ループ開始
            loop();
        }

        // ================= ゲーム進行管理 =================
        function checkWin() {
            if(!isBattleActive) return;

            if(player.hp <= 0) {
                endBattle(false);
            } else if(enemy.hp <= 0) {
                isBattleActive = false;
                clearTimeout(enemyAiLoopId);
                clearInterval(chargeIntervalId);

                currentStage++;
                if (currentStage >= enemiesList.length) {
                    endBattle(true);
                } else {
                    // 次のステージへ進む演出
                    showCutin("STAGE CLEAR!", "text-color-green");
                    setTimeout(() => {
                        // プレイヤーのHPを30%回復
                        const heal = Math.floor(player.maxHp * 0.3);
                        player.hp = Math.min(player.maxHp, player.hp + heal);
                        spawnDamageText('player-sprite', `+${heal}`, 'heal');
                        updateHUD();
                        
                        setTimeout(() => {
                            showCutin(`STAGE ${currentStage + 1}`, "text-color-blue");
                            setupStage();
                        }, 1500);
                    }, 1500);
                }
            }
        }

        function endBattle(isWin) {
            isBattleActive = false;
            clearTimeout(enemyAiLoopId);
            clearInterval(chargeIntervalId);

            // 少し間を置いてリザルト表示
            setTimeout(() => {
                const title = document.getElementById('result-title');
                const desc = document.getElementById('result-desc');
                
                if(isWin) {
                    title.innerText = 'GAME CLEAR!';
                    title.className = 'result-title font-magic win';
                    desc.innerText = '邪悪な「魔王ドリアン」を打ち倒し、果実界に真の平和が訪れた！あなたは伝説のファイターだ！';
                } else {
                    title.innerText = 'GAME OVER';
                    title.className = 'result-title font-magic lose';
                    desc.innerText = '魔王の強大な闇の力の前に、ファイターは力尽きてしまった。もう一度挑戦しよう！';
                }
                
                showScreen('screen-result');
            }, 1000);
        }

    </script>
</body>
